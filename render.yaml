services:
  - type: web
    name: alertaja-api
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: node server/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://alerta-ja.vercel.app
      - key: DATABASE_PATH
        value: /var/data/alertaja.sqlite
      - key: SESSION_SECRET
        generateValue: true
    disk:
      name: alertaja-data
      mountPath: /var/data
      sizeGB: 1
